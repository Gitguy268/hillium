<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hillium</title>
  <link rel="stylesheet" href="themes/base.css">
  <link rel="stylesheet" href="chrome.css">
  <link rel="stylesheet" href="themes/normal.css">
  <link rel="stylesheet" href="themes/win98.css">
  <link rel="stylesheet" href="themes/glass.css">
</head>
<body data-theme="normal" data-tabs="side" data-layout="zen">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4v4.5h-4.5"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/></symbol>
      <symbol id="i-shield-off" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M4 4l16 16"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-tabs" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13" rx="2"/><path d="M3.5 10h17M9 6v4"/></symbol>
      <symbol id="i-qr" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M9.5 5v14"/></symbol>
      <symbol id="i-mask" viewBox="0 0 24 24"><path d="M3 10c3-2 15-2 18 0-.5 4-3 6-5.5 6-2 0-2.5-2-3.5-2s-1.5 2-3.5 2C6 16 3.5 14 3 10z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-7L8 20v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/></symbol>
    </defs>
  </svg>

  <!-- The window's background. While this page sits above the web page it gets holes where
       the page and the assistant are, so they show through and nothing else does. -->
  <div id="frame-paint" class="frame-paint" aria-hidden="true"></div>

  <!-- Windows 98 caption bar; the other looks hide it. Drag area for the window. -->
  <header id="caption" class="caption">
    <img src="assets/logo.svg" alt="" class="caption-icon">
    <span id="caption-title" class="caption-title">Hillium</span>
    <span class="caption-buttons">
      <button class="cap" data-cmd="win-min" aria-label="Minimize"><span class="cap-min"></span></button>
      <button class="cap" data-cmd="win-max" aria-label="Maximize"><span class="cap-max"></span></button>
      <button class="cap" data-cmd="win-close" aria-label="Close"><span class="cap-close"></span></button>
    </span>
  </header>

  <div id="top" class="top">
    <div class="traffic-space"></div>
    <div id="tabstrip" class="tabstrip" role="tablist" aria-label="Tabs"></div>
    <button class="icon newtab-btn" data-cmd="new-tab" title="New Tab (⌘T)" aria-label="New Tab"><svg><use href="#i-plus"/></svg></button>
    <div class="drag-fill"></div>
  </div>

  <!-- In the Zen layout this bar moves into the sidebar's head (chrome.js placeToolbar). -->
  <nav id="toolbar" class="toolbar" aria-label="Navigation">
    <div class="traffic-space side-only"></div>
    <button id="back" class="icon nav" data-cmd="back" title="Back (⌘[)" aria-label="Back"><svg><use href="#i-back"/></svg><span class="label">Back</span></button>
    <button id="forward" class="icon nav" data-cmd="forward" title="Forward (⌘])" aria-label="Forward"><svg><use href="#i-forward"/></svg><span class="label">Forward</span></button>
    <button id="reload" class="icon nav" data-cmd="reload" title="Reload (⌘R)" aria-label="Reload"><svg><use href="#i-reload"/></svg><span class="label">Refresh</span></button>
    <button class="icon nav home" data-cmd="home" title="Home (⇧⌘H)" aria-label="Home"><svg><use href="#i-home"/></svg><span class="label">Home</span></button>

    <div id="omni-wrap" class="omni-wrap">
      <form id="omnibox" class="omnibox" role="search" autocomplete="off">
        <span class="address-label">A<u>d</u>dress</span>
        <button type="button" id="site" class="site" data-cmd="site-info" title="Site information" aria-label="Site information"><svg><use href="#i-search"/></svg></button>
        <span id="mode-chip" class="chip" hidden></span>
        <input id="address" name="address" spellcheck="false" placeholder="Search or enter address" aria-label="Address and search" aria-autocomplete="both" aria-controls="suggest-list">
        <button type="button" id="zoom-chip" class="zoom-chip" data-cmd="zoom-reset" title="Reset zoom" hidden></button>
        <button type="button" id="qr-btn" class="icon mini" data-cmd="share-qr" title="Share as QR code" aria-label="Share page as QR code"><svg><use href="#i-qr"/></svg></button>
        <button type="button" id="star" class="icon mini" data-cmd="bookmark" title="Bookmark this tab (⌘D)" aria-label="Bookmark this tab"><svg><use href="#i-star"/></svg></button>
        <button type="submit" class="go">Go</button>
      </form>
    </div>

    <button id="shield" class="icon shield" data-cmd="site-info" title="Blocked on this page" aria-label="Blocking on this site"><svg><use href="#i-shield"/></svg><span id="blocked" class="badge" hidden></span></button>
    <button class="icon dl-btn top-only" data-cmd="downloads-panel" title="Downloads" aria-label="Downloads"><svg><use href="#i-download"/></svg><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/></svg></button>
    <button id="menu-btn" class="icon menu-btn top-only" data-menu title="Menu" aria-label="Menu" aria-haspopup="menu"><svg><use href="#i-menu"/></svg><span class="start-label">Hillium</span></button>
  </nav>

  <div id="body" class="body">
    <aside id="sidebar" class="sidebar" aria-label="Tabs">
      <div id="side-head" class="side-head"></div>
      <div id="essentials" class="essentials" aria-label="Pinned tabs"></div>
      <div id="sidetabs" class="sidetabs" role="tablist" aria-label="Tabs"></div>
      <button class="side-new" data-cmd="new-tab"><svg><use href="#i-plus"/></svg><span>New Tab</span></button>
      <div class="side-foot">
        <button class="icon" data-menu title="Menu" aria-label="Menu" aria-haspopup="menu"><svg><use href="#i-menu"/></svg></button>
        <button class="icon" data-cmd="new-private-tab" title="New Private Tab (⇧⌘N)" aria-label="New Private Tab"><svg><use href="#i-mask"/></svg></button>
        <span class="grow"></span>
        <button class="icon dl-btn" data-cmd="downloads-panel" title="Downloads" aria-label="Downloads"><svg><use href="#i-download"/></svg><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/></svg></button>
        <button id="ai-btn" class="icon" data-cmd="assistant" title="Assistant (⇧⌘A)" aria-label="Assistant"><svg><use href="#i-chat"/></svg></button>
        <button class="icon" data-cmd="compact" title="Hide sidebar (⌃⌥C)" aria-label="Compact mode"><svg><use href="#i-sidebar"/></svg></button>
      </div>
    </aside>
    <div id="column" class="column">
      <div id="bookmarks-bar" class="bookmarks-bar" aria-label="Bookmarks" hidden></div>
      <div id="banner" class="banner" role="alert" hidden></div>
      <div id="findbar" class="findbar" hidden>
        <input id="find" placeholder="Find in page" aria-label="Find in page">
        <span id="find-count" class="find-count"></span>
        <button class="icon mini" id="find-prev" aria-label="Previous match"><svg><use href="#i-back"/></svg></button>
        <button class="icon mini" id="find-next" aria-label="Next match"><svg><use href="#i-forward"/></svg></button>
        <button class="icon mini" id="find-close" aria-label="Close find bar"><svg><use href="#i-close"/></svg></button>
      </div>
      <main id="page-slot" class="page-slot"></main>
    </div>
    <aside id="panel-slot" class="panel-slot" hidden></aside>
  </div>

  <footer id="statusbar" class="statusbar">
    <span id="status-text" class="status-cell grow">Done</span>
    <span id="status-blocked" class="status-cell"></span>
    <span id="status-zone" class="status-cell zone">Internet</span>
  </footer>

  <!-- Overlays: the toolbar page goes on top of the web page while one is open. -->
  <div id="scrim" class="scrim" hidden></div>

  <div id="suggest" class="suggest popover" hidden>
    <ul id="suggest-list" class="suggest-list" role="listbox" aria-label="Suggestions"></ul>
  </div>

  <div id="menu" class="menu popover" role="menu" hidden>
    <button role="menuitem" data-cmd="new-tab"><span>New Tab</span><kbd>⌘T</kbd></button>
    <button role="menuitem" data-cmd="new-window"><span>New Window</span><kbd>⌘N</kbd></button>
    <button role="menuitem" data-cmd="new-private-tab"><span>New Private Tab</span><kbd>⇧⌘N</kbd></button>
    <hr>
    <button role="menuitem" data-cmd="history"><span>History</span><kbd>⌘Y</kbd></button>
    <button role="menuitem" data-cmd="bookmarks"><span>Bookmarks</span><kbd>⌥⌘B</kbd></button>
    <button role="menuitem" data-cmd="downloads"><span>Downloads</span><kbd>⇧⌘J</kbd></button>
    <hr>
    <div class="menu-row" role="group" aria-label="Zoom">
      <span>Zoom</span>
      <span class="seg">
        <button data-cmd="zoom-out" aria-label="Zoom out">−</button><button id="zoom-level" data-cmd="zoom-reset" aria-label="Reset zoom">100%</button><button data-cmd="zoom-in" aria-label="Zoom in">+</button>
      </span>
    </div>
    <button role="menuitem" data-cmd="find"><span>Find in Page…</span><kbd>⌘F</kbd></button>
    <button role="menuitem" data-cmd="print"><span>Print…</span><kbd>⌘P</kbd></button>
    <button role="menuitem" data-cmd="share-qr"><span>Share as QR Code…</span><kbd></kbd></button>
    <hr>
    <div class="menu-row" role="group" aria-label="Look">
      <span>Look</span>
      <span class="seg">
        <button data-theme-pick="normal">Normal</button><button data-theme-pick="win98">98</button><button data-theme-pick="glass">Glass</button>
      </span>
    </div>
    <div class="menu-row" role="group" aria-label="Tabs">
      <span>Tabs</span>
      <span class="seg">
        <button data-tabs-pick="side">Side</button><button data-tabs-pick="top">Top</button>
      </span>
    </div>
    <button role="menuitem" data-cmd="compact" class="check" id="compact-item"><span>Compact Mode</span><kbd>⌃⌥C</kbd></button>
    <button role="menuitem" data-cmd="bookmarks-bar" class="check" id="bar-item"><span>Bookmarks Bar</span><kbd>⇧⌘B</kbd></button>
    <hr>
    <button role="menuitem" data-cmd="assistant"><span>Assistant</span><kbd>⇧⌘A</kbd></button>
    <button role="menuitem" data-cmd="palette"><span>Commands…</span><kbd>⌘K</kbd></button>
    <button role="menuitem" data-cmd="settings"><span>Settings</span><kbd>⌘,</kbd></button>
  </div>

  <div id="palette" class="palette popover" role="dialog" aria-label="Commands" hidden>
    <input id="palette-input" placeholder="Type a command, or search tabs and history" aria-label="Command search" autocomplete="off" spellcheck="false">
    <ul id="palette-list" class="palette-list" role="listbox"></ul>
  </div>

  <div id="siteinfo" class="siteinfo popover" role="dialog" aria-labelledby="siteinfo-host" hidden>
    <div class="si-head">
      <strong id="siteinfo-host"></strong>
      <span id="siteinfo-conn" class="si-conn"></span>
    </div>
    <div id="siteinfo-body"></div>
  </div>

  <div id="dlpanel" class="dlpanel popover" role="dialog" aria-label="Downloads" hidden>
    <ul id="dl-list" class="dl-list"></ul>
    <button class="dl-all" data-cmd="downloads">Show All Downloads</button>
  </div>

  <div id="qr" class="dialog popover qr-dialog" role="dialog" aria-labelledby="qr-title" hidden>
    <div class="dialog-title"><h2 id="qr-title">Share page</h2><button class="icon mini" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button></div>
    <div class="dialog-body qr-body">
      <canvas id="qr-canvas" width="264" height="264"></canvas>
      <p id="qr-url" class="qr-url"></p>
      <p class="hint">Scan it with a phone camera. The code is made on this Mac.</p>
      <button type="button" id="qr-copy">Copy Link</button>
    </div>
  </div>

  <script type="module" src="chrome.js"></script>
</body>
</html>
